<%
  require "digest"
  worktree = ENV.fetch("DATABASE_SUFFIX", Digest::SHA256.hexdigest(Rails.root.realpath.to_s)[0, 8])
  safe_suffix = worktree.downcase.gsub(/[^a-z0-9_]/, "_").gsub(/_+/, "_").sub(/\A_/, "").sub(/_\z/, "")
%>

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    database: rails_app_starter_kit_development_<%= safe_suffix %>
  queue:
    <<: *default
    database: rails_app_starter_kit_development_queue_<%= safe_suffix %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb

test:
  primary:
    <<: *default
    database: rails_app_starter_kit_test_<%= safe_suffix %>
  queue:
    <<: *default
    database: rails_app_starter_kit_test_queue_<%= safe_suffix %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
